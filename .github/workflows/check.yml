name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m bridge.server --config bridge/config.example.json --check
      - run: python -m compileall -q bridge scripts
      - run: bash -n scripts/build_hap.sh
  tv-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/prepare_client.py
      - run: node --test tests/tv-runtime.test.cjs
      - run: node --test tests/tv-audio-probe.test.cjs
      - run: node --test tests/tv-notifications.test.cjs
      - run: python scripts/test_decoder_recovery.py
      - run: python scripts/test_audio_interrupt_recovery.py
      - run: python scripts/test_audio_gain_owner.py
      - run: c++ -std=c++17 tests/tv-audio-level.test.cpp -o /tmp/tv-audio-test && /tmp/tv-audio-test
      - run: c++ -std=c++17 tests/tv-remote-audio-gain.test.cpp -o /tmp/tv-audio-gain-test && /tmp/tv-audio-gain-test
      - run: c++ -std=c++17 tests/tv-decode-quality.test.cpp -o /tmp/tv-decode-test && /tmp/tv-decode-test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path .work/client/rustdesk_ffi/Cargo.toml --no-default-features protocol::session
      - run: cargo test --manifest-path .work/client/rustdesk_ffi/Cargo.toml --no-default-features quality_
      - run: cargo test --manifest-path .work/client/rustdesk_ffi/Cargo.toml --no-default-features pressure
      - run: cargo test --manifest-path .work/client/rustdesk_ffi/Cargo.toml --no-default-features high_resolution_vp9
